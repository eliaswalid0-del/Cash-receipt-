<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Cash Receipt</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom right, #f0f9ff, #e0e7ff);
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; color: #1f2937; margin-bottom: 10px; }
        .header p { color: #6b7280; font-size: 14px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }

        .card h2 { font-size: 20px; color: #1f2937; margin-bottom: 20px; }
        .field-item { margin-bottom: 20px; }
        .field-item label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .field-item input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        .field-item input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        .add-section { border-top: 1px solid #e5e7eb; padding-top: 20px; margin-top: 20px; }
        .add-section h3 { font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 10px; }
        .add-inputs { display: flex; gap: 8px; }
        .add-inputs input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; color: white; width: 100%; padding: 12px; }
        .btn-danger:hover { background: #dc2626; }

        .sig-label { font-size: 12px; color: #6b7280; margin-bottom: 10px; display: block; }
        
        .sig-box { 
            border: 3px dashed #60a5fa; 
            border-radius: 6px; 
            overflow: hidden; 
            margin-bottom: 12px;
            background: white;
            width: 100%;
            touch-action: none;
        }
        
        #signaturePad { 
            display: block; 
            width: 100%;
            cursor: crosshair;
            background: white;
            touch-action: none;
            min-height: 250px;
        }

        .sig-status { margin-top: 12px; padding: 12px; background: #d1fae5; border: 1px solid #6ee7b7; border-radius: 6px; color: #047857; text-align: center; font-weight: 600; display: none; }
        .sig-status.active { display: block; }

        .preview {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 32px;
            margin-bottom: 30px;
        }

        .preview h1 { font-size: 24px; font-weight: bold; color: #1f2937; text-align: center; margin-bottom: 8px; }
        .preview-date { text-align: center; color: #6b7280; font-size: 12px; margin-bottom: 32px; }
        .preview-field { display: flex; justify-content: space-between; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; margin-bottom: 12px; font-weight: 600; }
        .preview-field span:last-child { color: #2563eb; }

        .preview-sig { margin-top: 48px; padding-top: 32px; border-top: 1px solid #e5e7eb; text-align: center; }
        .preview-sig p { color: #6b7280; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
        .preview-sig-status { color: #059669; font-weight: bold; }

        #previewSignature { 
            display: block; 
            width: 100%; 
            max-width: 400px; 
            height: 250px; 
            border: 1px solid #ddd; 
            border-radius: 4px;
            margin: 0 auto;
            background: white;
        }

        .button-group { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .btn-large { padding: 12px 24px; font-size: 15px; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover:not(:disabled) { background: #059669; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Digital Cash Receipt</h1>
            <p>Driver Signature & PDF Receipt</p>
        </div>

        <div class="grid">
            <!-- LEFT: FORM -->
            <div class="card">
                <h2>Receipt Details</h2>
                
                <div class="field-item">
                    <label>Amount</label>
                    <input type="text" id="amount" placeholder="Enter amount" oninput="updatePreview()">
                </div>

                <div class="field-item">
                    <label>Driver Name</label>
                    <input type="text" id="driverName" placeholder="Enter driver name" oninput="updatePreview()">
                </div>

                <div class="field-item">
                    <label>Date</label>
                    <input type="date" id="date" oninput="updatePreview()">
                </div>

                <div id="customFields"></div>

                <div class="add-section">
                    <h3>Add Custom Field</h3>
                    <div class="add-inputs">
                        <input type="text" id="customFieldName" placeholder="e.g., Vehicle ID">
                        <button class="btn btn-primary" onclick="addCustomField()">+ Add</button>
                    </div>
                </div>
            </div>

            <!-- RIGHT: SIGNATURE -->
            <div class="card">
                <h2>Driver Signature</h2>
                <span class="sig-label">👆 Sign here (or use mouse)</span>
                
                <div class="sig-box">
                    <canvas id="signaturePad"></canvas>
                </div>
                
                <button class="btn btn-danger" onclick="clearSignature()">✕ Clear Signature</button>
                <div class="sig-status" id="sigStatus">✓ Signature Captured</div>
            </div>
        </div>

        <!-- PREVIEW (ALSO USED FOR PDF) -->
        <div class="preview" id="receiptPreview">
            <h1>CASH RECEIPT</h1>
            <div class="preview-date" id="previewDate"></div>

            <div id="previewFields"></div>

            <div class="preview-sig">
                <p>Driver Signature:</p>
                <canvas id="previewSignature"></canvas>
                <p class="preview-sig-status" id="previewSigStatus">Awaiting signature...</p>
            </div>
        </div>

        <!-- BUTTONS -->
        <div class="button-group">
            <button class="btn btn-success btn-large" id="downloadBtn" onclick="downloadPDF()" disabled>📥 Download PDF</button>
            <button class="btn btn-primary btn-large" id="emailBtn" onclick="emailPDF()" disabled>📧 Email Receipt</button>
        </div>
    </div>

    <script>
        let signaturePad, signatureCtx;
        let previewSignature, previewCtx;
        let isDrawing = false;
        let isSigned = false;

        window.addEventListener('load', function() {
            initializeApp();
        });

        function initializeApp() {
            // Setup signature pad
            signaturePad = document.getElementById('signaturePad');
            signatureCtx = signaturePad.getContext('2d', { willReadFrequently: true });
            
            // Set actual canvas size
            signaturePad.width = signaturePad.offsetWidth;
            signaturePad.height = 250;
            
            signatureCtx.fillStyle = '#ffffff';
            signatureCtx.fillRect(0, 0, signaturePad.width, signaturePad.height);
            signatureCtx.lineCap = 'round';
            signatureCtx.lineJoin = 'round';
            signatureCtx.lineWidth = 2.5;
            signatureCtx.strokeStyle = '#000000';

            // Setup preview signature canvas (for preview + PDF)
            previewSignature = document.getElementById('previewSignature');
            previewCtx = previewSignature.getContext('2d', { willReadFrequently: true });
            previewSignature.width = 400;
            previewSignature.height = 250;
            
            previewCtx.fillStyle = '#ffffff';
            previewCtx.fillRect(0, 0, previewSignature.width, previewSignature.height);

            // Attach events
            attachEvents();
            
            // Set today's date
            document.getElementById('date').valueAsDate = new Date();
            updatePreview();
        }

        function attachEvents() {
            // Mouse
            signaturePad.addEventListener('mousedown', startDrawing);
            signaturePad.addEventListener('mousemove', draw);
            signaturePad.addEventListener('mouseup', stopDrawing);
            signaturePad.addEventListener('mouseout', stopDrawing);

            // Touch
            signaturePad.addEventListener('touchstart', startDrawing, false);
            signaturePad.addEventListener('touchmove', draw, false);
            signaturePad.addEventListener('touchend', stopDrawing, false);
        }

        function getCoords(e) {
            const rect = signaturePad.getBoundingClientRect();
            let x, y;
            
            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }
            
            return { x, y };
        }

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            const coords = getCoords(e);
            signatureCtx.beginPath();
            signatureCtx.moveTo(coords.x, coords.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const coords = getCoords(e);
            signatureCtx.lineTo(coords.x, coords.y);
            signatureCtx.stroke();
            
            // Copy to preview in real-time
            syncPreviewSignature();
            markSigned();
        }

        function stopDrawing(e) {
            e.preventDefault();
            isDrawing = false;
        }

        function syncPreviewSignature() {
            // Copy signature to preview canvas
            const imageData = signatureCtx.getImageData(0, 0, signaturePad.width, signaturePad.height);
            
            // Scale for preview
            previewCtx.clearRect(0, 0, previewSignature.width, previewSignature.height);
            previewCtx.fillStyle = '#ffffff';
            previewCtx.fillRect(0, 0, previewSignature.width, previewSignature.height);
            
            // Draw scaled signature
            previewCtx.drawImage(signaturePad, 0, 0, signaturePad.width, signaturePad.height, 0, 0, previewSignature.width, previewSignature.height);
        }

        function markSigned() {
            if (!isSigned) {
                isSigned = true;
                document.getElementById('sigStatus').classList.add('active');
                document.getElementById('previewSigStatus').textContent = '✓ Signature Captured';
                document.getElementById('downloadBtn').disabled = false;
                document.getElementById('emailBtn').disabled = false;
            }
        }

        function clearSignature() {
            signatureCtx.fillStyle = '#ffffff';
            signatureCtx.fillRect(0, 0, signaturePad.width, signaturePad.height);
            
            previewCtx.fillStyle = '#ffffff';
            previewCtx.fillRect(0, 0, previewSignature.width, previewSignature.height);
            
            isSigned = false;
            document.getElementById('sigStatus').classList.remove('active');
            document.getElementById('previewSigStatus').textContent = 'Awaiting signature...';
            document.getElementById('downloadBtn').disabled = true;
            document.getElementById('emailBtn').disabled = true;
        }

        function updatePreview() {
            const html = `
                <div class="preview-field"><span>Amount:</span><span>${document.getElementById('amount').value || '—'}</span></div>
                <div class="preview-field"><span>Driver Name:</span><span>${document.getElementById('driverName').value || '—'}</span></div>
                <div class="preview-field"><span>Date:</span><span>${document.getElementById('date').value || '—'}</span></div>
            `;
            
            document.getElementById('previewFields').innerHTML = html;
            document.getElementById('previewDate').textContent = new Date().toLocaleString();
        }

        function addCustomField() {
            const name = document.getElementById('customFieldName').value.trim();
            if (!name) return;

            const div = document.createElement('div');
            div.className = 'field-item';
            div.innerHTML = `
                <label>${name}</label>
                <input type="text" placeholder="Enter value" oninput="updatePreview()">
            `;
            document.getElementById('customFields').appendChild(div);
            document.getElementById('customFieldName').value = '';
            updatePreview();
        }

        function downloadPDF() {
            try {
                const element = document.getElementById('receiptPreview');
                const opt = {
                    margin: 10,
                    filename: `receipt_${new Date().getTime()}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    console.log('PDF downloaded successfully');
                }).catch(err => {
                    console.error('PDF download error:', err);
                    alert('Download started! Check your downloads folder. Error: ' + err);
                });
            } catch(err) {
                console.error('Error:', err);
                alert('There was an error: ' + err.message);
            }
        }

        function emailPDF() {
            let body = 'CASH RECEIPT\n\n';
            body += `Amount: ${document.getElementById('amount').value}\n`;
            body += `Driver Name: ${document.getElementById('driverName').value}\n`;
            body += `Date: ${document.getElementById('date').value}\n`;
            body += `\n✓ Driver Signature: Confirmed\n`;
            body += `Generated: ${new Date().toLocaleString()}\n`;
            body += `\nTo attach receipt:\n1. Right-click page → Save as PDF\n2. Attach to this email`;
            
            window.location.href = `mailto:?subject=Cash Receipt - ${new Date().toLocaleDateString()}&body=${encodeURIComponent(body)}`;
        }
    </script>
</body>
</html>
